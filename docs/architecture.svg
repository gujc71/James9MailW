<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" role="img"
     aria-label="James9Mail architecture: desktop mail clients (Thunderbird · Outlook) over SMTP · IMAP · CalDAV · CardDAV, web client with a per-account IndexedDB mirror, web server, James9Mail server and an external mail server, sharing one DBMS (MariaDB) and one filesystem">
  <title>James9Mail architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .box   { stroke-width: 1.5; rx: 10; }
      .name  { font: 600 15px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill: #0f172a; }
      .sub   { font: 11px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill: #475569; }
      .edge  { stroke: #64748b; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .file  { stroke-dasharray: 5 4; }
      .local { stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
      .lbl   { font: 11px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill: #334155;
               paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
      .note  { font: 11px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill: #64748b; }
      .ttl   { font: 700 16px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <rect x="0.75" y="0.75" width="1198.5" height="608.5" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="ttl" x="24" y="34">James9Mail architecture</text>

  <!-- row 0 : desktop mail clients (MUA) -->
  <rect class="box" x="573" y="71" width="230" height="84" fill="#fff7ed" stroke="#f97316"/>
  <text class="name" x="688" y="101"  text-anchor="middle">Mail clients (MUA)</text>
  <text class="sub"  x="688" y="122" text-anchor="middle">Thunderbird · Outlook · mobile</text>
  <text class="sub"  x="688" y="140" text-anchor="middle">mail · calendar · contacts</text>

  <line class="edge" x1="640" y1="155" x2="566" y2="241"/>
  <text class="lbl" x="594" y="199" text-anchor="end">CalDAV · CardDAV (/dav)</text>

  <line class="edge" x1="736" y1="155" x2="810" y2="241"/>
  <text class="lbl" x="782" y="199">SMTP · IMAP</text>

  <!-- row 1 : client, web server, mail server, outside -->
  <rect class="box" x="24"   y="249" width="230" height="96" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="name" x="139" y="283"  text-anchor="middle">James9Mail Web Client</text>
  <text class="sub"  x="139" y="304" text-anchor="middle">React · Dexie cache · postal-mime</text>
  <text class="sub"  x="139" y="322" text-anchor="middle">Browser :5173</text>

  <rect class="box" x="390"  y="249" width="230" height="96" fill="#eff6ff" stroke="#3b82f6"/>
  <text class="name" x="505" y="283"  text-anchor="middle">James9Mail Web Server</text>
  <text class="sub"  x="505" y="304" text-anchor="middle">Fastify · Kysely · nodemailer</text>
  <text class="sub"  x="505" y="322" text-anchor="middle">NodeJS :4000</text>

  <rect class="box" x="756"  y="249" width="230" height="96" fill="#f0fdf4" stroke="#22c55e"/>
  <text class="name" x="871" y="283"  text-anchor="middle">James9Mail Server</text>
  <text class="sub"  x="871" y="304" text-anchor="middle">WebAdmin :8000 · SMTP :25</text>
  <text class="sub"  x="871" y="322" text-anchor="middle">JSieve · JPA</text>

  <rect class="box" x="1060" y="269" width="116" height="56" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="name" x="1118" y="292" text-anchor="middle" font-size="13">External</text>
  <text class="sub"  x="1118" y="310" text-anchor="middle">mail servers</text>

  <!-- row 2 : shared resources -->
  <rect class="box" x="24" y="71" width="230" height="84" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text class="name" x="139" y="101" text-anchor="middle">Local mirror (IndexedDB)</text>
  <text class="sub"  x="139" y="122" text-anchor="middle">Dexie · per account · offline read</text>
  <text class="sub"  x="139" y="140" text-anchor="middle">list · bodies (LRU 300) · mailboxes</text>

  <rect class="box" x="390" y="460" width="230" height="96" fill="#fefce8" stroke="#ca8a04"/>
  <text class="name" x="505" y="497" text-anchor="middle">DBMS (MariaDB)</text>
  <text class="sub"  x="505" y="518" text-anchor="middle">james_db</text>
  <text class="sub"  x="505" y="536" text-anchor="middle">JAMES_* · GU_* tables</text>

  <rect class="box" x="756" y="460" width="230" height="96" fill="#faf5ff" stroke="#a855f7"/>
  <text class="name" x="871" y="497" text-anchor="middle">Shared filesystem</text>
  <text class="sub"  x="871" y="518" text-anchor="middle">maildir · staging · large</text>
  <text class="sub"  x="871" y="536" text-anchor="middle">same absolute paths</text>

  <!-- edges -->
  <line class="edge" x1="254" y1="297" x2="382" y2="297"/>
  <text class="lbl" x="318" y="287" text-anchor="middle">/api · /large</text>

  <line class="edge" x1="620" y1="281" x2="748" y2="281"/>
  <text class="lbl" x="684" y="271" text-anchor="middle">write · WebAdmin</text>

  <line class="edge" x1="620" y1="321" x2="748" y2="321"/>
  <text class="lbl" x="684" y="341" text-anchor="middle">send · SMTP 25</text>

  <line class="edge" x1="986" y1="297" x2="1052" y2="297"/>
  <text class="lbl" x="1019" y="285" text-anchor="middle" font-size="10">relay</text>

  <line class="edge local" x1="139" y1="249" x2="139" y2="163"/>
  <text class="lbl" x="151" y="201">delta sync</text>
  <text class="lbl" x="151" y="217">MODSEQ · tombstone</text>

  <line class="edge" x1="480" y1="345" x2="480" y2="452"/>
  <text class="lbl" x="492" y="412">read · direct SQL</text>

  <line class="edge file" x1="560" y1="349" x2="770" y2="452"/>
  <text class="lbl" x="566" y="372">raw mail · attachments</text>

  <line class="edge" x1="800" y1="349" x2="596" y2="452"/>
  <text class="lbl" x="786" y="374" text-anchor="end">JPA read · write</text>

  <line class="edge file" x1="846" y1="345" x2="846" y2="452"/>
  <text class="lbl" x="858" y="412">store raw mail</text>

  <text class="note" x="24" y="584">solid — HTTP · SMTP · IMAP · SQL</text>
  <text class="note" x="230" y="584">dashed — file access</text>
  <text class="note" x="370" y="584">dotted — browser IndexedDB</text>
</svg>
